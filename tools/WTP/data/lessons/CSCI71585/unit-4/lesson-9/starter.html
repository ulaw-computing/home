<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading List | Campus Book Club</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Campus Book Club</h1>

        <section class="add-book">
            <h2>Add a Book</h2>
            <div class="field">
                <label for="new-title">Title</label>
                <input type="text" id="new-title">
            </div>
            <div class="field">
                <label for="new-author">Author</label>
                <input type="text" id="new-author">
            </div>
            <button type="button" id="add-button">Add book</button>
        </section>

        <h2>Reading List</h2>
        <p class="count" id="book-count"></p>
        <p class="empty-message hidden" id="empty-message">The reading list is empty. Add a book to get started.</p>
        <div class="book-list" id="book-list"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
