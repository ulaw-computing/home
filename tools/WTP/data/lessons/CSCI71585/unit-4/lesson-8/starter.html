<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schedule | Beginners' Web Workshop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Beginners' Web Workshop</h1>

        <section class="panel">
            <h2>Session in Focus</h2>
            <h3 id="session-title">Session title</h3>
            <p id="session-details">Session details</p>
            <p>Speaker: <span id="session-speaker">?</span></p>
            <p>Topics: <span id="session-topics">?</span></p>
        </section>

        <section class="panel">
            <h2>Full Schedule</h2>
            <p class="count" id="beginner-count">?</p>
            <p class="output" id="session-list">Sessions will appear here.</p>
            <p>Featured: <span id="featured-session">?</span></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
