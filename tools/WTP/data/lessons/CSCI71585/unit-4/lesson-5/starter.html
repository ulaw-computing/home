<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studio Headphones | Soundwave</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <article class="product">
            <img class="product-image" src="https://placehold.co/400x300?text=White" alt="Studio Headphones in white" width="400" height="300">

            <div class="product-details">
                <h1 id="product-name">Studio Headphones</h1>
                <p class="price">£99.99</p>
                <p class="delivery-note">Free delivery on all orders.</p>

                <h2>Features</h2>
                <ul class="features">
                    <li>Noise cancelling</li>
                    <li>30-hour battery life</li>
                    <li>Foldable design</li>
                    <li>Built-in microphone</li>
                </ul>

                <p class="stock-warning hidden">Only 3 left in stock!</p>

                <a class="buy-link" href="#">Add to basket</a>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
