<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Study Tools</h1>
        <p class="output" id="greeting">Welcome message will appear here.</p>

        <section class="panel">
            <h2>Unit Converter</h2>
            <p class="output" id="km-result">Distance will appear here.</p>
            <p class="output" id="temp-result">Temperature will appear here.</p>
        </section>

        <section class="panel">
            <h2>Study Planner</h2>
            <p class="output" id="study-time">Study time will appear here.</p>
            <p class="output" id="timer-message">Waiting...</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
