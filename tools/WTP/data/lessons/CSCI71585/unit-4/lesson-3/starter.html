<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decisions in JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Decisions in JavaScript</h1>

        <section class="panel">
            <h2>Northern Lights Cinema</h2>
            <p>Children under 16: £6. Aged 65 and over: £7. Students: £8. Adults: £10. Every ticket is half price on Tuesdays.</p>
            <p class="output" id="ticket-price">Ticket price will appear here.</p>
            <p class="output" id="late-showing">Late showing information will appear here.</p>
        </section>

        <section class="panel">
            <h2>Module Results Checker</h2>
            <p class="output" id="module-result">Result will appear here.</p>
            <p>Passed: <span id="module-passed">?</span></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
