<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revision Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Revision Planner</h1>

        <section class="panel">
            <h2>Topics</h2>
            <p class="count" id="topic-count">0 topics to revise</p>
            <p class="output" id="topic-list">Topics will appear here.</p>
        </section>

        <section class="panel">
            <h2>Practice Test Results</h2>
            <p>All scores: <span class="output-inline" id="all-scores">?</span></p>
            <p>Passed: <span class="output-inline" id="passed-count">?</span></p>
            <p>First score below 50: <span class="output-inline" id="first-fail">?</span></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
